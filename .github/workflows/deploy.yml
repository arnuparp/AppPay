name: Deploy Apppay to VPS

# 1) push เข้า main = deploy อัตโนมัติ
# 2) กดปุ่ม Run workflow เองก็ได้ (เช่นตอนอยาก re-deploy / rollback)
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# กัน deploy ซ้อนกัน: ถ้ามี run ค้างอยู่ให้รอคิว ไม่ใช่วิ่งพร้อมกัน
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOTNET_VERSION: '9.0.x'
  PUBLISH_DIR: ${{ github.workspace }}\publish
  TARGET_DIR: 'C:\inetpub\apppay'
  HEALTH_URL: 'http://localhost/'

jobs:
  deploy:
    name: Build & Deploy
    # label พื้นฐานที่ runner ทุกตัวบน Windows มีให้อัตโนมัติ
    # วันที่มี VPS หลายเครื่อง ค่อยเติม label เฉพาะเจาะจงกลับเข้ามา
    runs-on: [self-hosted, windows]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ไม่ใช้ actions/setup-dotnet เพราะ VPS ลง .NET 9 SDK ไว้ในเครื่องแล้ว
      # (action ตัวนั้นจะพยายามติดตั้งซ้ำลง C:\Program Files\dotnet ซึ่ง NETWORK SERVICE เขียนไม่ได้)
      - name: Check .NET SDK
        run: dotnet --version

      - name: Restore
        run: dotnet restore Apppay.sln

      - name: Build
        run: dotnet build Apppay.sln -c Release --no-restore

      # ถ้ามีเทสต์ค่อยเปิดบรรทัดนี้
      # - name: Test
      #   run: dotnet test Apppay.sln -c Release --no-build

      - name: Publish
        run: >
          dotnet publish Apppay/Apppay.csproj
          -c Release
          -o "${{ env.PUBLISH_DIR }}"

      - name: Deploy to IIS
        shell: powershell
        run: >
          .\deploy\deploy.ps1
          -Source "${{ env.PUBLISH_DIR }}"
          -Target "${{ env.TARGET_DIR }}"
          -HealthUrl "${{ env.HEALTH_URL }}"

      - name: Summary
        if: always()
        shell: powershell
        run: |
          $status = if ('${{ job.status }}' -eq 'success') { 'สำเร็จ' } else { 'ล้มเหลว' }
          $text = "## Deploy $status`n`n- commit: ${{ github.sha }}`n- โดย: ${{ github.actor }}`n- เวลา: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')`n"
          # เขียนเป็น UTF-8 ไม่มี BOM — Windows PowerShell 5.1 ใส่ BOM ให้เองถ้าใช้ Out-File
          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $text, (New-Object System.Text.UTF8Encoding($false)))
